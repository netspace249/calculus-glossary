<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Glossary</title>
    <script>
        // This page signals the main glossary tab to navigate to the term,
        // then closes itself automatically.
        (function() {
            var params = new URLSearchParams(window.location.search);
            var term = params.get('term') || '';
            
            // Write the term request to localStorage — the main page listens for this
            localStorage.setItem('glossary-open-term', JSON.stringify({
                term: term,
                timestamp: Date.now()
            }));

            // Close this tab after a brief moment
            setTimeout(function() { window.close(); }, 300);
        })();
    </script>
</head>
<body></body>
</html>
